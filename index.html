<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 终极解压大作战！ ⚡</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: linear-gradient(135deg, #1e1e2f, #111119); color: #fff; font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #setup-screen { text-align: center; background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); max-width: 90%; width: 400px; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; color: #a4b0be; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; text-align: center; outline: none; border: 1px solid rgba(255,255,255,0.2); }
        input[type="text"]:focus { border-color: #ff4757; background: rgba(255,255,255,0.15); }
        .file-input-wrapper { position: relative; display: inline-block; width: 100%; }
        .file-input-btn { display: block; width: 100%; padding: 12px; background: rgba(255,255,255,0.15); color: #fff; border: 1px dashed rgba(255,255,255,0.4); border-radius: 8px; text-align: center; cursor: pointer; font-size: 14px; }
        #image-input { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        #file-name { display: block; text-align: center; font-size: 12px; color: #2ed573; margin-top: 5px; }
        button.start-btn { background: #ff4757; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); }
        #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; padding: 20px; }
        #hud { display: flex; justify-content: space-between; width: 100%; margin-bottom: 20px; background: rgba(0,0,0,0.4); padding: 10px 20px; border-radius: 10px; font-size: 16px; }
        .stat-val { color: #ffd32a; font-weight: bold; }
        #target-area { position: relative; width: 260px; height: 260px; margin: 30px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #target { width: 230px; height: 230px; background: #ffa502; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: #1e1e2f; box-shadow: 0 0 30px rgba(255, 165, 2, 0.6); border: 6px solid #fff; transition: transform 0.05s; text-align: center; padding: 15px; word-break: break-all; background-size: cover; background-position: center; background-repeat: no-repeat; overflow: hidden; }
        #target span { background: rgba(255, 255, 255, 0.85); padding: 4px 8px; border-radius: 6px; color: #111; max-width: 100%; }
        #target.hit { transform: scale(0.88); box-shadow: 0 0 40px rgba(255, 71, 87, 0.8); border-color: #ff4757; }
        .damage-text { position: absolute; font-size: 30px; font-weight: 900; color: #ff3838; text-shadow: 2px 2px 0px #000; pointer-events: none; animation: floatUp 0.6s ease-out forwards; white-space: nowrap; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.4); } }
        #shop { width: 100%; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; }
        .shop-title { font-size: 16px; margin-bottom: 10px; color: #2ed573; text-align: center; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .shop-btn { background: #2ed573; color: #fff; border: none; padding: 6px 12px; font-size: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .shop-btn:disabled { background: #57606f; cursor: not-allowed; }
        .shake { animation: screenShake 0.15s infinite; }
        @keyframes screenShake { 0% { transform: translate(2px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 50% { transform: translate(1px, -1px) rotate(1deg); } 80% { transform: translate(-3px, 1px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(0deg); } }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>💥 终极解压大作战 💥</h1>
        <div class="form-group">
            <label>1. 输入你想出气的对象名字：</label>
            <input type="text" id="target-name" placeholder="例如：Jay" maxlength="10">
        </div>
        <div class="form-group">
            <label>2. 上传目标的照片（可选）：</label>
            <div class="file-input-wrapper">
                <div class="file-input-btn">点击选择图片或拍照</div>
                <input type="file" id="image-input" accept="image/*" onchange="handleImageUpload(this)">
            </div>
            <span id="file-name"></span>
        </div>
        <button class="start-btn" onclick="startGame()">开始无情开打</button>
    </div>

    <div id="game-screen">
        <div id="hud">
            <div>解压值 (金币): <span id="score-display" class="stat-val">0</span></div>
            <div>当前武器: <span id="weapon-display" class="stat-val">徒手狂揍</span></div>
        </div>
        <div id="target-area" onmousedown="hitTarget(event)" ontouchstart="hitTarget(event)">
            <div id="target"><span>目标</span></div>
        </div>
        <div id="shop">
            <div class="shop-title">🛠️ 升级你的出气装备</div>
            <div class="shop-item">
                <div><strong>充气软棒</strong><br><small>每次打击 +2 解压值</small></div>
                <button id="upgrade-btn-1" class="shop-btn" onclick="buyUpgrade(1, 50, 2, '充气软棒')">花费 50 购买</button>
            </div>
            <div class="shop-item">
                <div><strong>平底锅</strong><br><small>每次打击 +5 解压值</small></div>
                <button id="upgrade-btn-2" class="shop-btn" onclick="buyUpgrade(2, 200, 5, '平底锅')">花费 200 購買</button>
            </div>
            <div class="shop-item">
                <div><strong>终极正义铁拳</strong><br><small>每次打击 +15 解压值</small></div>
                <button id="upgrade-btn-3" class="shop-btn" onclick="buyUpgrade(3, 800, 15, '终极正义铁拳')">花费 800 购买</button>
            </div>
        </div>
    </div>
    <script>
        let score = 0;
        let dmgPerClick = 1;
        let targetName = "";
        let currentWeapon = "徒手狂揍";
        let uploadedImgBase64 = "";

        const punchSounds = [
            '💥 啪！', '🥊 咚！', '⚡ 轰！', '💥 锵！', '🔥 咻！', '👊 咵！'
        ];

        function handleImageUpload(input) {
            const file = input.files[0];
            if (file) {
                document.getElementById('file-name').innerText = "✓ 图片加载成功";
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImgBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function startGame() {
            const inputVal = document.getElementById('target-name').value.trim();
            targetName = inputVal || "压力源";
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            
            const targetEl = document.getElementById('target');
            if (uploadedImgBase64) {
                targetEl.style.backgroundImage = "url('" + uploadedImgBase64 + "')";
                targetEl.innerHTML = "<span>" + targetName + "</span>";
            } else {
                targetEl.style.backgroundColor = "#ffa502";
                targetEl.innerHTML = "<span>" + targetName + "</span>";
            }
            updateUI();
        }
        function hitTarget(e) {
            if (e.cancelable) e.preventDefault();
            
            score += dmgPerClick;
            updateUI();

            const targetEl = document.getElementById('target');
            targetEl.classList.add('hit');
            document.body.classList.add('shake');

            setTimeout(function() { targetEl.classList.remove('hit'); }, 50);
            setTimeout(function() { document.body.classList.remove('shake'); }, 150);

            let clientX, clientY;
            if (e.touches && e.touches[0]) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            createDamageText(clientX, clientY);
        }

        function createDamageText(x, y) {
            const targetArea = document.getElementById('target-area');
            const rect = targetArea.getBoundingClientRect();
            
            const relX = x - rect.left;
            const relY = y - rect.top;

            const text = document.createElement('div');
            text.className = 'damage-text';
            
            const randomSound = punchSounds[Math.floor(Math.random() * punchSounds.length)];
            text.innerText = randomSound + " +" + dmgPerClick;
            
            text.style.left = relX + "px";
            text.style.top = relY + "px";

            const randomX = (Math.random() - 0.5) * 120;
            const randomY = -(Math.random() * 60 + 40);
            text.style.setProperty('--x', randomX + "px");
            text.style.setProperty('--y', randomY + "px");

            targetArea.appendChild(text);

            setTimeout(function() { text.remove(); }, 600);
        }

        function buyUpgrade(id, cost, extraDmg, weaponName) {
            if (score >= cost) {
                score -= cost;
                dmgPerClick += extraDmg;
                currentWeapon = weaponName;

                document.getElementById("upgrade-btn-" + id).closest('.shop-item').style.display = 'none';
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('weapon-display').innerText = currentWeapon;

            checkShopButton(1, 50);
            checkShopButton(2, 200);
            checkShopButton(3, 800);
        }

        function checkShopButton(id, cost) {
            const btn = document.getElementById("upgrade-btn-" + id);
            if (btn) {
                btn.disabled = score < cost;
            }
        }
    </script>
</body>
</html>
